<html class="dialog">
	<head>
		<script src="file:///mminit.js"></script>
    	<script src="dlgFixCharacters.js"></script>
		<title>Fix Characters</title>
	</head>
	<STYLE TYPE=text/css>
		body{font-family:'Verdana',sans-serif; background-color:#FFFFFF; font-size:9pt; color:#000000;}
		H1{font-family:'Verdana',sans-serif; font-size:13pt; font-weight:bold; color:#AAAAAA; text-align:left}
		P{font-family:'Verdana',sans-serif; font-size:8pt; color:#000000;}
		TH{font-family:'Verdana',sans-serif; font-size:9pt; font-weight:bold; color:#000000; border-color:#000000; border-style: solid; border-left-width:0px; border-right-width:0px; border-top-width:0px; border-bottom-width:3px;}
		TD{font-family:'Verdana',sans-serif; font-size:8pt; color:#000000; border-color:#000000; border-style: solid; border-left-width:0px; border-right-width:0px; border-top-width:0px; border-bottom-width:1px;}
		TD.highlight{font-family:'Verdana',sans-serif; font-size:8pt; background-color:#FFFF77; color:#000000; border-color:#000000; border-style: solid; border-left-width:0px; border-right-width:0px; border-top-width:0px; border-bottom-width:1px;}
		TR.dark{background-color:#EEEEEE}
		TR.aleft TH{text-align:left}
	</STYLE>
	<body class="flex fill column" data-posSaveName='dlgFixCharactersSave'>
		<div class="fill flex column padding">
			<div class="fill flex column scrollable" data-id="divFileContent" id="divFileContent" ></div>
			<div data-control-class="Buttons" data-id="top">
				<div data-id="btnOK" data-default="1" data-tip="Save and Close Window"></div>
				<div data-id="btnCancel" data-tip="Close Without Saving"></div>
			</div>
		</div>
	</body>
</html>
